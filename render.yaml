services:
  - type: web
    name: samfit-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - {key: NODE_ENV, value: production}
      - {key: DATABASE_URL, sync: false}
      - {key: JWT_SECRET, generateValue: true}
      - {key: FRONTEND_URL, sync: false}
      - {key: AI_API_KEY, sync: false}
      - {key: AI_MODEL, sync: false}
      - {key: CLOUDINARY_CLOUD_NAME, sync: false}
      - {key: CLOUDINARY_API_KEY, sync: false}
      - {key: CLOUDINARY_API_SECRET, sync: false}
